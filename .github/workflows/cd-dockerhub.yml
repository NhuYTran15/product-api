name: CI and CD Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --detach --wait

      - name: Check Product API and MongoDB health
        run: curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down --volumes

  push-image:
    needs: healthcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  deploy-local:
    needs: push-image
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    concurrency:
      group: product-api-local-deployment
      cancel-in-progress: false
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      PRODUCT_API_TAG: ${{ github.sha }}
      PORT: 3001

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker Engine
        run: docker info

      - name: Validate production Docker Compose
        run: docker compose -f docker-compose-prod.yaml config --quiet

      - name: Pull release images
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        run: >-
          docker compose -f docker-compose-prod.yaml up -d --wait
          --wait-timeout 120 --remove-orphans

      - name: Verify deployed Product API
        run: curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health"

      - name: Show deployment status
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -f docker-compose-prod.yaml logs --no-color
